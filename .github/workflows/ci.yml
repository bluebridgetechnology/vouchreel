name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests mock the database; these only need to exist so modules that read them at import time load.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret-not-used-for-anything-real
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install FFmpeg and fonts (real-FFmpeg integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -filters | grep -q drawtext

      - run: npm ci

      - name: Lint (ESLint + design-token, feedback and contrast guards)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Widget bundle (enforces the 15 KB gzip budget)
        run: npm run widget:build

      - name: Build
        run: npm run build
