name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a branch without a pull request be checked by hand
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests mock the database; these only need to exist so modules that read them at import time load.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install FFmpeg and fonts (real-FFmpeg integration tests)
        uses: ./.github/actions/install-ffmpeg

      - run: npm ci

      - name: Lint (ESLint + design-token, feedback and contrast guards)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Widget bundle (enforces the 15 KB gzip budget)
        run: npm run widget:build

      - name: Build
        run: npm run build

  # The unit job above runs with the database mocked. This one runs the same tests against a real
  # Postgres (the *.integration.test.ts files skip themselves without TEST_DATABASE_URL), including
  # the real Remotion render. (The browser tests are the `browsers` job below.)
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # An S3-compatible server for the storage adapter tests
      moto:
        image: motoserver/moto:latest
        ports:
          - 5555:5000
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vouchreel_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vouchreel_test
      # An S3-compatible server (moto) for the storage adapter tests
      S3_TEST_ENDPOINT: http://127.0.0.1:5555
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install FFmpeg and fonts
        uses: ./.github/actions/install-ffmpeg

      - run: npm ci

      - name: Wait for the S3-compatible server
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5555 && exit 0; sleep 1; done; echo "moto did not start"; exit 1

      - name: Create and migrate the database
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE vouchreel_test"
          # Straight through the workspace: turbo only passes the variables its config lists, and not these ones
          npm run db:migrate -w @vouchreel/dashboard

      - name: Unit and integration tests against Postgres
        run: |
          npm test -w @vouchreel/dashboard
          npm test -w @vouchreel/video

      - name: Real-render test (Remotion + Chromium)
        run: npm run test:render -w @vouchreel/video

  # The Playwright smoke tests on a production build, one job per browser so the three run at the same time.
  # (They share seeded rows, so each browser gets its own database.)
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vouchreel_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vouchreel_e2e
      E2E_BROWSER: ${{ matrix.browser }}
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The e2e suite makes a small video with ffmpeg, and the app transcodes uploads with it
      - name: Install FFmpeg and fonts
        uses: ./.github/actions/install-ffmpeg

      - run: npm ci

      # Only the browser this job tests. The downloaded browser is cached; the system libraries are still installed each time.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/dashboard

      - name: Video font widths match the numbers in the catalogue
        if: matrix.browser == 'chromium'
        run: npm run fonts:measure -w @vouchreel/video -- --check

      - name: Create and migrate the database
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE vouchreel_e2e"
          npm run db:migrate -w @vouchreel/dashboard

      - name: Build for the browser tests
        run: npm run build:e2e -w @vouchreel/dashboard

      # The suite reseeds the database on every run
      - name: Browser smoke tests (/admin) in ${{ matrix.browser }}
        run: npm run test:e2e -w @vouchreel/dashboard

      - name: Keep the Playwright report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: apps/dashboard/e2e/.results
          if-no-files-found: ignore

  # Builds the real video-worker image (Debian, Chromium libraries, fonts, pre-built compositions),
  # then proves it works: it renders a frame, and as a worker it reports a working Chromium.
  video-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -w @vouchreel/dashboard

      - name: Build the video-worker image
        run: docker build --target video-worker -t vouchreel-video-worker .

      - name: The image can render a frame
        run: |
          docker run --rm --entrypoint sh vouchreel-video-worker -c '
            cd /repo/packages/video &&
            npx tsx scripts/preview.ts --template=minimal --aspect=9:16 --times=3 &&
            test -s out/minimal-9x16-t3.png'

      - name: As a worker it reports in with a working Chromium
        run: |
          docker run -d --name vw --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            vouchreel-video-worker
          for i in $(seq 1 30); do
            row=$(psql -h localhost -U postgres -tAc "select capabilities->>'chromium' from worker_heartbeats where kind = 'video-worker' limit 1")
            [ -n "$row" ] && break
            sleep 2
          done
          echo "chromium: $row"
          docker logs vw
          [ "$row" = "ok" ]
          docker stop vw
          stopped=$(psql -h localhost -U postgres -tAc "select count(*) from worker_heartbeats where kind = 'video-worker' and stopped_at is not null")
          echo "marked stopped: $stopped"
          [ "$stopped" = "1" ]

  # The optional self-hosted observability stack: the compose files are valid, every service starts,
  # Grafana has its datasources and dashboard, and an error sent to GlitchTip is stored.
  observability-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: >-
        docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.observability.yml
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway environment
        run: |
          cat > .env.production <<ENV
          POSTGRES_PASSWORD=ci
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          METRICS_TOKEN=ci-metrics-token
          GLITCHTIP_SECRET_KEY=ci-glitchtip-secret-0123456789abcdef
          GLITCHTIP_DB_PASSWORD=ci
          GRAFANA_ADMIN_PASSWORD=ci-admin
          CRON_SECRET=ci-cron
          ENV
      - name: The compose files are valid together
        run: $COMPOSE --env-file .env.production config -q
      - name: Start the stack (without the app)
        run: |
          $COMPOSE --env-file .env.production up -d glitchtip-web glitchtip-worker loki alloy prometheus grafana
      - name: Every service answers
        run: |
          wait_for() { for i in $(seq 1 60); do curl -fsS "$1" >/dev/null 2>&1 && return 0; sleep 3; done; echo "not ready: $1"; $COMPOSE --env-file .env.production logs --tail=80; return 1; }
          wait_for http://localhost:8001/_health/
          wait_for http://localhost:3001/api/health
          docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.observability.yml --env-file .env.production exec -T loki wget -qO- http://localhost:3100/ready || true
      - name: Grafana has the datasources and the dashboard
        run: |
          curl -fsS -u admin:ci-admin http://localhost:3001/api/datasources | tee /dev/stderr | grep -q '"uid":"loki"'
          curl -fsS -u admin:ci-admin http://localhost:3001/api/datasources | grep -q '"uid":"prometheus"'
          curl -fsS -u admin:ci-admin "http://localhost:3001/api/search?query=Vouchreel" | grep -q vouchreel-overview
      - name: Prometheus has its scrape job configured
        run: |
          $COMPOSE --env-file .env.production exec -T prometheus wget -qO- http://localhost:9090/api/v1/targets | grep -q '"job":"vouchreel"'
      - name: An error sent to GlitchTip is accepted and stored
        run: |
          $COMPOSE --env-file .env.production exec -T glitchtip-web ./manage.py shell -c "
          from django.contrib.auth import get_user_model
          from apps.organizations_ext.models import Organization
          from apps.projects.models import Project, ProjectKey
          u = get_user_model().objects.create_superuser(email='ci@example.com', password='ci-pass-123')
          org = Organization.objects.create(name='ci')
          org.add_user(u)
          p = Project.objects.create(name='vouchreel', organization=org)
          print('PROJECT=' + str(p.id))
          print('KEY=' + ProjectKey.objects.filter(project=p).first().public_key.hex)
          " | tee key.txt
          PID=$(grep '^PROJECT=' key.txt | cut -d= -f2 | tr -d '\r')
          KEY=$(grep '^KEY=' key.txt | cut -d= -f2 | tr -d '\r')
          EVENT_ID=$(cat /proc/sys/kernel/random/uuid | tr -d '-')
          status=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "http://localhost:8001/api/$PID/store/?sentry_key=$KEY&sentry_version=7" \
            -H 'Content-Type: application/json' \
            -d "{\"event_id\":\"$EVENT_ID\",\"message\":\"ci test event\",\"level\":\"error\",\"platform\":\"javascript\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "store answered $status: $(cat resp.txt)"
          [ "$status" = "200" ]
          # Give the worker a moment, then ask the database whether an event arrived
          sleep 10
          $COMPOSE --env-file .env.production exec -T glitchtip-postgres psql -U glitchtip -tAc "select count(*) from issue_events_issueevent" | tee count.txt
          [ "$(tr -d '[:space:]' < count.txt)" -ge 1 ]
      - name: Logs on failure
        if: failure()
        run: $COMPOSE --env-file .env.production logs --tail=200
