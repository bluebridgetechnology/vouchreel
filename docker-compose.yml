version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: vouchreel-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: vouchreel
      POSTGRES_PASSWORD: vouchreel
      POSTGRES_DB: vouchreel
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
