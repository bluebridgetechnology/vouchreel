<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Widget preview</title>
  <!-- A stand-in for a customer's page. The dashboard's widget editor frames it and sends the widget
       configuration with postMessage; preview.js draws the real widget on it. Colour literals here are
       mock-page content, not widget tokens. -->
  <style>
    :root { color-scheme: light; --page: #f7f6f3; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4; --block: #ece9e4; }
    body.dark { color-scheme: dark; --page: #151311; --ink: #f5f5f4; --muted: #a8a29e; --line: #2c2825; --block: #24201d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--page); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px clamp(16px, 5vw, 48px); border-bottom: 1px solid var(--line); }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .logo i { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); display: inline-block; }
    .links { display: flex; gap: 18px; }
    .links span { width: 44px; height: 8px; border-radius: 4px; background: var(--block); }
    .hero { max-width: 720px; margin: 0 auto; padding: clamp(40px, 9vw, 88px) clamp(16px, 5vw, 48px) 32px; text-align: center; }
    .hero h1 { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 14px; }
    .hero p { color: var(--muted); margin: 0 auto 24px; max-width: 520px; }
    .cta { display: inline-block; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--page); font-weight: 600; font-size: 14px; }
    #vr-slot { max-width: 1120px; margin: 8px auto 32px; padding: 0 clamp(4px, 3vw, 32px); }
    #vr-slot.vr-slot-empty { display: none; }
    .rows { max-width: 720px; margin: 0 auto; padding: 8px clamp(16px, 5vw, 48px) 120px; display: grid; gap: 12px; }
    .rows span { height: 10px; border-radius: 5px; background: var(--block); }
    .rows span:nth-child(3n) { width: 70%; }
  </style>
</head>
<body>
  <div class="nav"><div class="logo"><i></i>Your brand</div><div class="links"><span></span><span></span><span></span></div></div>
  <section class="hero">
    <h1>Your headline goes here</h1>
    <p>This is a sample page so you can see how the widget sits on a real website, at this screen size.</p>
    <span class="cta">Get started</span>
  </section>
  <div id="vr-slot" class="vr-slot-empty"></div>
  <div class="rows"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <script src="preview.js"></script>
</body>
</html>
