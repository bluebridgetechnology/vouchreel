# Production overrides for VPS deployments.
#
# Usage (requires Docker Compose v2.24+ for the !reset tag):
#   cp .env.production.example .env.production   # fill in real values
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# See docs/deployment.md for the full guide.

services:
  postgres:
    # Never publish the database port in production
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vouchreel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-vouchreel}

  # One-shot job: applies drizzle migrations, then exits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: vouchreel-migrate
    restart: 'no'
    env_file: !reset
      - .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vouchreel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vouchreel}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
        NEXT_PUBLIC_WIDGET_URL: ${NEXT_PUBLIC_WIDGET_URL:-}
    env_file: !reset
      - .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vouchreel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vouchreel}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Triggers the scheduled jobs (webhook retries every 5 minutes, review sync hourly).
  # Vercel does this with vercel.json crons; on a VPS something has to call the endpoints.
  scheduler:
    image: curlimages/curl:8.10.1
    restart: always
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set (the app refuses cron requests without it)}
    depends_on:
      - app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        tick=0
        while true; do
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/process-webhooks > /dev/null || echo "process-webhooks failed"
          if [ $$((tick % 12)) -eq 0 ]; then
            curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/sync-reviews > /dev/null || echo "sync-reviews failed"
          fi
          tick=$$((tick + 1))
          sleep 300
        done

